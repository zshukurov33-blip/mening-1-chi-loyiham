<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruhshona ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #050510;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            user-select: none;
        }

        /* Orqa fondagi koinot va salyutlar */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Asosiy oyna konteyneri */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 45px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 133, 0.3);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
        }

        /* Ichkariga sho'ng'ish animatsiyasi */
        .card.dive-out {
            transform: scale(2.5);
            opacity: 0;
        }

        .card.dive-in {
            transform: scale(0.4);
            opacity: 0;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 42, 133, 0.25);
            border: 1px solid #ff2a85;
            color: #ff85b8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .icon {
            font-size: 68px;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(255, 42, 133, 0.8));
            animation: bounce 2.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #ff85b8, #ffd1dc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            line-height: 1.65;
            color: #e0e0e0;
            margin-bottom: 32px;
        }

        .btn {
            background: linear-gradient(135deg, #ff2a85 0%, #ff7a59 100%);
            color: white;
            border: none;
            padding: 16px 38px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 42, 133, 0.5);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 42, 133, 0.7);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.3s;
        }

        .dot.active {
            width: 24px;
            border-radius: 10px;
            background: #ff2a85;
        }
    </style>
</head>
<body>

<canvas id="space"></canvas>

<div class="container">
    <div class="card" id="card">
        <div class="badge" id="step-badge">1 / 5 QADAM</div>
        <span class="icon" id="card-icon">✨</span>
        <h1 id="card-title">Salom, Ruhshona!</h1>
        <p id="card-text">Siz uchun kichik bir koinot yaratdim. Ichkariga sho‘ng‘ishga tayyormisiz?</p>
        <button class="btn" id="next-btn">Ichkariga kirish 🚀</button>
        <div class="dots" id="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</div>

<script>
    // 5 ta sahna ma'lumotlari
    const steps = [
        {
            badge: "1 / 5 QADAM",
            icon: "✨",
            title: "Salom, Ruhshona!",
            text: "Siz uchun kichik bir koinot yaratdim. Ichkariga sho‘ng‘ishga tayyormisiz?",
            btn: "Ichkariga kirish 🚀"
        },
        {
            badge: "2 / 5 QADAM",
            icon: "🌸",
            title: "Noyob Qalb Egasi",
            text: "Dunyoda milliardlab insonlar bor, lekin sizning samimiyligingiz va mehringiz hammasidan ajralib turadi.",
            btn: "Yana chuqurroq 💫"
        },
        {
            badge: "3 / 5 QADAM",
            icon: "🦋",
            title: "Sehrli Tabassum",
            text: "Siz kulganingizda atrofdagi barcha g‘am-tashvishlar unutiladi. Tabassumingizni hech qachon yo‘qotmang!",
            btn: "Keyingi bekat 🌟"
        },
        {
            badge: "4 / 5 QADAM",
            icon: "👑",
            title: "Haqiqiy Malika",
            text: "Har bir orzuingiz ro‘yobga chiqishini, hayotingiz esa faqat quvonchli kunlardan iborat bo‘lishini tilayman.",
            btn: "Syurprizni ochish 🎁"
        },
        {
            badge: "YAKUNIY SYURPRIZ",
            icon: "💖",
            title: "Baxtli bo‘ling, Ruhshona!",
            text: "Siz eng go‘zal baxtga loyiqsiz! Ekranga barmog‘ingizni tekkizing — bu yulduzlar va salyutlar siz uchun! 🎆",
            btn: "Qaytadan uchish 🔄"
        }
    ];

    let currentStep = 0;
    let warpSpeed = 2; // Yulduzlar tezligi

    const card = document.getElementById('card');
    const badge = document.getElementById('step-badge');
    const icon = document.getElementById('card-icon');
    const title = document.getElementById('card-title');
    const text = document.getElementById('card-text');
    const btn = document.getElementById('next-btn');
    const dots = document.querySelectorAll('.dot');

    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Kosmik tezlikni oshirish (ichkariga sho'ng'ish effekti)
        warpSpeed = 35;
        card.classList.add('dive-out');

        // Markazda salyut otish
        createFirework(window.innerWidth / 2, window.innerHeight / 2);

        setTimeout(() => {
            currentStep = (currentStep + 1) % steps.length;
            const data = steps[currentStep];

            badge.innerText = data.badge;
            icon.innerText = data.icon;
            title.innerText = data.title;
            text.innerText = data.text;
            btn.innerText = data.btn;

            dots.forEach((d, idx) => {
                d.classList.toggle('active', idx === currentStep);
            });

            card.classList.remove('dive-out');
            card.classList.add('dive-in');

            setTimeout(() => {
                card.classList.remove('dive-in');
                warpSpeed = currentStep === 4 ? 6 : 2;
                if (currentStep === 4) {
                    launchFinalFireworks();
                }
            }, 50);

        }, 450);
    });

    // Koinot tunneli (3D Starfield) va Salyutlar
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    let w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = [];
    for (let i = 0; i < 250; i++) {
        stars.push({
            x: (Math.random() - 0.5) * 2000,
            y: (Math.random() - 0.5) * 2000,
            z: Math.random() * 2000,
            color: ['#ffffff', '#ff85b8', '#ffd1dc', '#a29bfe'][Math.floor(Math.random() * 4)]
        });
    }

    let fireworks = [];

    function createFirework(x, y) {
        const colors = ['#ff2a85', '#ff7a59', '#ffd700', '#00f2fe', '#ff85b8', '#ffffff'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 50; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 7 + 2;
            fireworks.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color: color,
                size: Math.random() * 3 + 1.5
            });
        }
    }

    function launchFinalFireworks() {
        let count = 0;
        const timer = setInterval(() => {
            if (currentStep !== 4 || count > 12) {
                clearInterval(timer);
                return;
            }
            createFirework(Math.random() * w, Math.random() * (h * 0.6));
            count++;
        }, 450);
    }

    document.addEventListener('click', (e) => {
        createFirework(e.clientX, e.clientY);
    });

    function render() {
        ctx.fillStyle = 'rgba(5, 5, 16, 0.35)';
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h / 2;

        // Yulduzlarni chizish
        for (let s of stars) {
            s.z -= warpSpeed;
if (s.z <= 1) {
s.z = 2000;
s.x = (Math.random() - 0.5) * 2000;
s.y = (Math.random() - 0.5) * 2000;
}
const sx = cx + (s.x / s.z) * 500;
const sy = cy + (s.y / s.z) * 500;
const size = (1 - s.z / 2000) * 4;
ctx.beginPath();
ctx.arc(sx, sy, Math.max(0.5, size), 0, Math.PI * 2);
ctx.fillStyle = s.color;
ctx.fill();
}
// Salyut uchqunlarini chizish
for (let i = fireworks.length - 1; i >= 0; i--) {
let f = fireworks[i];
f.x += f.vx;
f.y += f.vy;
f.vy += 0.08;
f.vx *= 0.97;
f.vy *= 0.97;
f.alpha -= 0.018;
if (f.alpha <= 0) {
fireworks.splice(i, 1);
continue;
}
ctx.save();
ctx.globalAlpha = f.alpha;
ctx.beginPath();
ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
ctx.fillStyle = f.color;
ctx.fill();
ctx.restore();
}
requestAnimationFrame(render);
}
render();
